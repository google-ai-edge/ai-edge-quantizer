# YAML schema for GitHub Actions:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#
# This workflow will run at the end of every day to
# 1. Build Python Wheel Nightly Version
# 2. Upload to PyPI

name: Python Package Build and Release (nightly)

on:
  workflow_dispatch:  # Allow manual triggers
  schedule:
    - cron: "0 0 * * *" # 12am UTC (5pm PST)

jobs:
  build-and-release-nightly:
    name: Build and Release Python Wheel Nightly
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Update Metadata for Nightly
        run: |
          sed -i 's/name = "ai-edge-quantizer"/name = "ai-edge-quantizer-nightly"/' pyproject.toml

          BASE_VERSION=$(cat VERSION | xargs)
          DATE=$(date +'%Y%m%d')
          echo "${BASE_VERSION}.dev${DATE}" > VERSION

          echo "Building $(cat PACKAGE_NAME) version $(cat VERSION)"

      - name: Build Nightly Package
        run: |
          uv build

      - name: Install OSS Exit Gate staging dependencies
        run: python3 -m pip install --upgrade pip keyring twine keyrings.google-artifactregistry-auth
      - name: Authenticate to Google Cloud (OSS Exit Gate WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Stage package in OSS Exit Gate Artifact Registry
        run: |
          python3 -m twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/ai-edge-quantizer--pypi \
            dist/*
      - name: Trigger OSS Exit Gate release
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo '{"publish_all": true}' > publish_all.json
          unset CLOUDSDK_CORE_PROJECT
          gcloud storage cp publish_all.json \
            "gs://oss-exit-gate-prod-projects-bucket/ai-edge-quantizer/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"

  run-pip-install-and-import-test:
    needs: build-and-release-nightly
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    name: Test Install and Import ai-edge-quantizer-nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Install ai-edge-quantizer-nightly
        run: |
          python -m pip install ai-edge-quantizer-nightly

      - name: Import ai-edge-quantizer
        run: |
          python -c "import ai_edge_quantizer"
